<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <!-- Shield with a crossed-out ad mark -->
  <g transform="translate(1000 205)">
    <circle r="150" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.25"/>
    <circle r="118" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>
    <path d="M0 -92 L74 -64 L74 6 C74 58 40 92 0 110 C-40 92 -74 58 -74 6 L-74 -64 Z"
          fill="#0f1b30" stroke="url(#ring)" stroke-width="6" stroke-linejoin="round"/>
    <text x="0" y="22" text-anchor="middle" font-size="56" font-weight="800" fill="#e2e8f0">AD</text>
    <line x1="-52" y1="-38" x2="52" y2="62" stroke="#f43f5e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="80" y="128" font-size="26" font-weight="600" fill="#60a5fa" letter-spacing="3">FOR WINDOWS 10 / 11</text>
  <text x="80" y="196" font-size="64" font-weight="800" fill="#f8fafc">Ungoogled Chromium</text>
  <text x="80" y="250" font-size="34" font-weight="500" fill="#cbd5e1">Ad-free  ·  Private  ·  Lightweight</text>

  <!-- One-line install pill -->
  <rect x="80" y="296" width="700" height="64" rx="14" fill="#020617" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="112" cy="328" r="6" fill="#f43f5e"/>
  <circle cx="132" cy="328" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="328" r="6" fill="#22c55e"/>
  <text x="182" y="337" font-family="Cascadia Code, Consolas, monospace" font-size="24" fill="#e2e8f0"><tspan fill="#22d3ee">PS&gt;</tspan> irm …/install.ps1 | iex</text>
  <text x="80" y="398" font-size="22" fill="#94a3b8">One command  ·  2 minutes  ·  no admin needed</text>
</svg>
